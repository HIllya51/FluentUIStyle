name: Release

on:
  push:
    tags:
      - '[0-9]+*'
      - 'v[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 固定发布到 rolling release "common"（同名资产自动替换）
  RELEASE_TAG: common
  # YY-Thunks v1.2.2（x86 腿：链接 WinXP obj 以支持 Windows XP）
  YY_THUNKS_URL: https://github.com/Chuyu-Team/YY-Thunks/releases/download/v1.2.2/YY-Thunks-Objs.zip
  YY_THUNKS_SHA256: 518ed7ef4825e8a41997fbccfa2c8090cf31a6038fd51520a2e49886f947f9fc

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Qt 5.15.2 / x64
            os: windows-2022
            qt-arch: win64_msvc2019_64
            cmake-platform: x64
            package-suffix: Windows-Qt5.15.2-x64
            xp: 'false'

          - name: Windows / Qt 5.15.2 / x86 (Windows XP)
            os: windows-2022
            qt-arch: win32_msvc2019
            cmake-platform: Win32
            package-suffix: Windows-Qt5.15.2-x86-XP
            xp: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: 5.15.2
          arch: ${{ matrix.qt-arch }}
          cache: true
          cache-key-prefix: qt-${{ matrix.os }}-5.15.2-${{ matrix.qt-arch }}
          setup-python: false

      - name: Download YY-Thunks objs (XP only)
        if: matrix.xp == 'true'
        shell: pwsh
        run: |
          $dst = "$env:RUNNER_TEMP/yy-thunks"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          $zip = "$dst/YY-Thunks-Objs.zip"
          curl.exe -fsSL -o $zip "$env:YY_THUNKS_URL"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "$env:YY_THUNKS_SHA256") {
              throw "YY-Thunks-Objs.zip checksum mismatch: got $hash"
          }
          # 只抽取 x86 WinXP obj + XP SP3 系统导出表（导入表校验用）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipObj = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
              foreach ($name in @('objs/x86/YY_Thunks_for_WinXP.obj', 'Config/x86/5.1.2600.txt')) {
                  $entry = $zipObj.Entries | Where-Object { $_.FullName -eq $name }
                  if (-not $entry) { throw "$name not found in archive" }
                  [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$dst/" + [IO.Path]::GetFileName($name), $true)
              }
          } finally {
              $zipObj.Dispose()
          }
          Write-Host "YY-Thunks obj: $dst/YY_Thunks_for_WinXP.obj"
          Write-Host "XP exports  : $dst/5.1.2600.txt"

      - name: Configure CMake
        shell: pwsh
        run: |
          $xpArgs = ""
          if ("${{ matrix.xp }}" -eq "true") {
              $xpArgs = "-DFLUENTUI3_WINXP_SUPPORT=ON -DYY_THUNKS_OBJ=`"$env:RUNNER_TEMP/yy-thunks/YY_Thunks_for_WinXP.obj`""
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake-platform }} `
            -DBUILD_LIBRARY=ON `
            -DBUILD_PLUGIN=ON `
            -DBUILD_FRAMELESS=ON `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_QTCREATOR_PLUGIN=OFF `
            -DEXWIDGETS_BUILD_TESTS=OFF `
            -DFLUENTUI3STYLE_COPY_TO_QT_DIR=OFF `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/stage" `
            $xpArgs

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Install to Stage
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Verify Windows XP compatibility (PE headers & imports)
        if: matrix.xp == 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile
          python .github/scripts/verify_xp.py "${{ github.workspace }}/stage" "$env:RUNNER_TEMP/yy-thunks/5.1.2600.txt"

      - name: Package SDK
        shell: pwsh
        run: |
          $sdkZipName = "FluentUI3-SDK-$env:RELEASE_TAG-${{ matrix.package-suffix }}.zip"
          Compress-Archive -Path "${{ github.workspace }}/stage/*" -DestinationPath "${{ github.workspace }}/$sdkZipName"
          Write-Host "Created SDK Package: $sdkZipName"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.package-suffix }}
          path: "${{ github.workspace }}/*.zip"
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract Release Notes from changelog.txt
        id: release_notes
        shell: pwsh
        run: |
          $changelogFile = "Examples/Gallery/resources/changelog.txt"
          if (Test-Path $changelogFile) {
              $content = Get-Content $changelogFile -Raw -Encoding UTF8
              if ($content -match '(?s)(【更新内容[^】]+】.*?)(?=\r?\n【更新内容|\z)') {
                  $notes = $matches[1].Trim()
              } else {
                  $notes = "FluentUI3Style & ExWidgets Release $env:RELEASE_TAG"
              }
          } else {
              $notes = "FluentUI3Style & ExWidgets Release $env:RELEASE_TAG"
          }
          Set-Content -Path "release_notes.md" -Value $notes -Encoding UTF8
          Write-Host "Extracted Release Notes:"
          Write-Host $notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List Release Assets
        shell: bash
        run: |
          ls -la release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "common"
          tag_name: common
          body_path: release_notes.md
          files: release_assets/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
