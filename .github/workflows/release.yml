name: Release

on:
  push:
    tags:
      - '[0-9]+*'
      - 'v[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 固定发布到 rolling release "common"（同名资产自动替换）
  RELEASE_TAG: common
  # YY-Thunks v1.2.2（legacy 腿：Win7 链 x64 obj / WinXP 链 x86 obj）
  YY_THUNKS_URL: https://github.com/Chuyu-Team/YY-Thunks/releases/download/v1.2.2/YY-Thunks-Objs.zip
  YY_THUNKS_SHA256: 518ed7ef4825e8a41997fbccfa2c8090cf31a6038fd51520a2e49886f947f9fc

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # 1) x64 动态链接（常规，依赖 VC/UCRT 运行时）
          - name: Windows / Qt 5.15.2 / x64
            os: windows-2022
            qt-arch: win64_msvc2019_64
            cmake-platform: x64
            package-suffix: Windows-Qt5.15.2-x64
            legacy: ''

          # 2) x64 静态 CRT + YY-Thunks Win7 obj（Win7 RTM 无 SP 可加载）
          - name: Windows / Qt 5.15.2 / x64 (Win7 static)
            os: windows-2022
            qt-arch: win64_msvc2019_64
            cmake-platform: x64
            package-suffix: Windows-Qt5.15.2-x64-Win7
            legacy: Win7
            yy-obj: objs/x64/YY_Thunks_for_Win7.obj
            yy-exports: Config/x64/6.1.7600.txt

          # 3) x86 静态 CRT + YY-Thunks WinXP obj（XP SP3 可加载）
          - name: Windows / Qt 5.15.2 / x86 (WinXP static)
            os: windows-2022
            qt-arch: win32_msvc2019
            cmake-platform: Win32
            package-suffix: Windows-Qt5.15.2-x86-XP
            legacy: WinXP
            yy-obj: objs/x86/YY_Thunks_for_WinXP.obj
            yy-exports: Config/x86/5.1.2600.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: 5.15.2
          arch: ${{ matrix.qt-arch }}
          cache: true
          cache-key-prefix: qt-${{ matrix.os }}-5.15.2-${{ matrix.qt-arch }}
          setup-python: false

      - name: Download YY-Thunks objs (legacy legs)
        if: matrix.legacy != ''
        shell: pwsh
        run: |
          $dst = "$env:RUNNER_TEMP/yy-thunks"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          $zip = "$dst/YY-Thunks-Objs.zip"
          curl.exe -fsSL -o $zip "$env:YY_THUNKS_URL"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "$env:YY_THUNKS_SHA256") {
              throw "YY-Thunks-Objs.zip checksum mismatch: got $hash"
          }
          # 按 matrix 抽取对应架构的 obj + 目标系统导出表（导入表校验用）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipObj = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
              foreach ($name in @('${{ matrix.yy-obj }}', '${{ matrix.yy-exports }}')) {
                  $entry = $zipObj.Entries | Where-Object { $_.FullName -eq $name }
                  if (-not $entry) { throw "$name not found in archive" }
                  $target = "$dst/" + [IO.Path]::GetFileName($name)
                  [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
                  Write-Host "Extracted: $target"
              }
          } finally {
              $zipObj.Dispose()
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ matrix.legacy }}" -ne "") {
              $objName = Split-Path '${{ matrix.yy-obj }}' -Leaf
              $extra = @(
                  "-DFLUENTUI3_LEGACY_WINDOWS=${{ matrix.legacy }}",
                  "-DYY_THUNKS_OBJ=$env:RUNNER_TEMP/yy-thunks/$objName"
              )
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake-platform }} `
            -DBUILD_LIBRARY=ON `
            -DBUILD_PLUGIN=ON `
            -DBUILD_FRAMELESS=ON `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_QTCREATOR_PLUGIN=OFF `
            -DEXWIDGETS_BUILD_TESTS=OFF `
            -DFLUENTUI3STYLE_COPY_TO_QT_DIR=OFF `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/stage" `
            @extra

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Install to Stage
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"

      - name: Verify legacy Windows compatibility (PE headers & imports)
        if: matrix.legacy != ''
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile
          python .github/scripts/verify_legacy.py "${{ github.workspace }}/stage" "$env:RUNNER_TEMP/yy-thunks/$(Split-Path '${{ matrix.yy-exports }}' -Leaf)" "${{ matrix.legacy }}"

      - name: Package SDK
        shell: pwsh
        run: |
          $sdkZipName = "FluentUI3-SDK-$env:RELEASE_TAG-${{ matrix.package-suffix }}.zip"
          Compress-Archive -Path "${{ github.workspace }}/stage/*" -DestinationPath "${{ github.workspace }}/$sdkZipName"
          Write-Host "Created SDK Package: $sdkZipName"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.package-suffix }}
          path: "${{ github.workspace }}/*.zip"
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract Release Notes from changelog.txt
        id: release_notes
        shell: pwsh
        run: |
          $changelogFile = "Examples/Gallery/resources/changelog.txt"
          if (Test-Path $changelogFile) {
              $content = Get-Content $changelogFile -Raw -Encoding UTF8
              if ($content -match '(?s)(【更新内容[^】]+】.*?)(?=\r?\n【更新内容|\z)') {
                  $notes = $matches[1].Trim()
              } else {
                  $notes = "FluentUI3Style & ExWidgets Release $env:RELEASE_TAG"
              }
          } else {
              $notes = "FluentUI3Style & ExWidgets Release $env:RELEASE_TAG"
          }
          Set-Content -Path "release_notes.md" -Value $notes -Encoding UTF8
          Write-Host "Extracted Release Notes:"
          Write-Host $notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List Release Assets
        shell: bash
        run: |
          ls -la release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "common"
          tag_name: common
          body_path: release_notes.md
          files: release_assets/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
